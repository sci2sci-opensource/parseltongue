name: Deploy demos to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "."

      - name: Render demos
        working-directory: parseltongue/core/demos/ai2ai_pgmd
        run: python render_all.py

      - name: Assemble site
        run: |
          mkdir -p _site/demos
          touch _site/.nojekyll
          cp pages/index.html _site/index.html
          cp parseltongue/core/demos/ai2ai_pgmd/pgmd_out/*.html _site/demos/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
