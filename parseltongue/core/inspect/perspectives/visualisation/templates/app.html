<style type="text/tailwindcss">
@theme {
  --color-base: var(--base);
  --color-mantle: var(--mantle);
  --color-crust: var(--crust);
  --color-surface0: var(--surface0);
  --color-surface1: var(--surface1);
  --color-surface2: var(--surface2);
  --color-overlay0: var(--overlay0);
  --color-text: var(--text);
  --color-subtext: var(--subtext);
  --color-green: var(--green);
  --color-red: var(--red);
  --color-yellow: var(--yellow);
  --color-blue: var(--blue);
  --color-mauve: var(--mauve);
  --color-teal: var(--teal);
  --color-peach: var(--peach);
  --color-flamingo: var(--flamingo);
  --color-sky: var(--sky);
  --color-lavender: var(--lavender);
  --color-highlight: var(--highlight);
  --color-patronus: var(--patronus);
}
</style>
<style>
$palette_css
$base_css
</style>
<style>
.patronus-dot {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.patronus-dot::before {
  content: '';
  position: absolute;
  inset: -40%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--patronus-glow) 0%, var(--patronus-glow-outer) 40%, transparent 70%);
  opacity: 0.4;
  animation: patronus-pulse 3s ease-in-out infinite;
}
.patronus-dot::after {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--patronus-highlight) 0%, var(--patronus-core) 50%, var(--patronus-glow-outer) 100%);
}
.patronus-dot.tainted::before {
  background: radial-gradient(circle, var(--patronus-taint-glow) 0%, var(--patronus-taint-outer) 40%, transparent 70%);
}
.patronus-dot.tainted::after {
  background: radial-gradient(circle at 35% 35%, var(--red) 0%, var(--patronus-taint-core) 50%, var(--patronus-taint-outer) 100%);
}
.patronus-dot.warn::before {
  background: radial-gradient(circle, var(--patronus-warn-glow) 0%, var(--patronus-warn-outer) 40%, transparent 70%);
}
.patronus-dot.warn::after {
  background: radial-gradient(circle at 35% 35%, var(--yellow) 0%, var(--patronus-warn-core) 50%, var(--patronus-warn-outer) 100%);
}
@keyframes patronus-pulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.15); opacity: 0.25; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body class="bg-base text-text m-0 min-h-screen transition-colors duration-200">

<div id="app">

      <div class="flex-1 min-w-[200px] max-w-md relative">
        <input id="search" type="text" placeholder="Search names, values, modules..." autocomplete="off"

        <div id="search-suggestions" class="absolute top-full left-0 min-w-full w-max max-w-[500px] bg-mantle border border-surface1 rounded-lg mt-1 max-h-[240px] overflow-y-auto hidden z-50 shadow-lg"></div>

        <button id="btn-source" class="px-3 py-1 rounded-lg text-xs bg-mauve text-crust font-bold">Source</button>
        <button id="btn-structure" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext hover:bg-surface1">Structure</button>
        <button id="btn-layers" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext hover:bg-surface1">Layers</button>

    </div>
  </div>

  <!-- Source View -->
  <div id="source-view" class="p-4">
    <div id="source-container"></div>
  </div>

  <!-- Structure View -->
  <div id="structure-view" class="hidden p-4">
    <div id="modules-container"></div>
  </div>

  <!-- Layers View -->
  <div id="layers-view" class="hidden" style="height:calc(100vh - 60px); position:relative">
    <svg id="layers-svg" class="w-full h-full"></svg>
    <div id="layers-tooltip" class="fixed bg-surface0 border border-surface2 rounded-lg px-3 py-2 text-xs pointer-events-none max-w-sm whitespace-pre-wrap hidden z-30"></div>
    <!-- Controls overlay, top-left -->
    <div id="layers-controls" class="absolute top-3 left-3 flex gap-2 z-20">
      <button id="btn-back" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1 hidden">&larr; Back</button>
      <button id="btn-unfocus" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1 hidden">Show all</button>
      <button id="btn-taints" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1">Taints</button>
      <button id="btn-taint-focus" class="px-3 py-1 rounded-lg text-xs bg-surface0 text-subtext border border-surface2 hover:bg-surface1">Taint Focus</button>
    </div>
    <!-- Focus action popup -->
    <div id="focus-popup" class="fixed bg-mantle border border-mauve rounded-lg shadow-lg z-40 hidden">
      <button id="focus-popup-btn" class="px-4 py-2 text-xs text-mauve hover:bg-surface0 rounded-lg font-bold w-full text-left">Focus &rarr;</button>
    </div>
    <!-- Layer info overlay, bottom-left -->
    <div id="layer-info" class="fixed bottom-4 left-4 bg-mantle/95 backdrop-blur border border-surface1 rounded-lg p-3 text-xs z-20 max-w-xs hidden">
    </div>
  </div>

  <!-- Graph View -->
  <div id="graph-view" class="hidden" style="height:calc(100vh - 60px); position:relative">
    <svg id="graph" class="w-full h-full"></svg>
    <div id="tooltip" class="fixed bg-surface0 border border-surface2 rounded-lg px-3 py-2 text-xs pointer-events-none max-w-sm whitespace-pre-wrap hidden z-30"></div>
  </div>

  <!-- Detail Panel -->
  <div id="detail-panel" class="fixed top-0 right-0 h-full w-[420px] bg-mantle border-l border-surface1 z-30 transform translate-x-full transition-transform duration-200 overflow-y-auto">
    <div class="sticky top-0 bg-mantle/95 backdrop-blur border-b border-surface1 px-4 py-3 flex items-center justify-between">
      <h2 id="detail-title" class="text-sm font-bold text-lavender truncate"></h2>
      <button id="detail-close" class="text-overlay0 hover:text-text text-lg leading-none">&times;</button>
    </div>
    <div id="detail-body" class="p-4 text-sm space-y-4"></div>
  </div>
</div>

<script>
const DATA = $data_json;
const STRUCTURE_DATA = $structure_json;
const LAYERS = $layers_json;
const TAINT_DATA = $taint_json;
const FORM_TYPE = "$form_type";

// ── Theme toggle ──
(function() {
  const saved = localStorage.getItem('pltg-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
})();
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('pltg-theme', next);
  updateThemeIcon();
  // Refresh shared palette
  refreshPalette();
  // Reset graph/layers so they re-render with new colors
  graphInitialized = false;
  layersInitialized = false;
  const gSvg = document.getElementById('graph');
  if (gSvg) gSvg.innerHTML = '';
  const lSvg = document.getElementById('layers-svg');
  if (lSvg) lSvg.innerHTML = '';
  // Remove graph stats overlay if present
  const gs = document.getElementById('graph-stats');
  if (gs && gs.parentElement) gs.parentElement.remove();
  // Re-render current view
  if (typeof switchView === 'function') switchView(currentView);
}
function updateThemeIcon() {
  const icon = document.getElementById('theme-icon');
  if (icon) icon.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '&#9790;' : '&#9788;';
  // Update SVG logo fill
  document.querySelectorAll('h1 svg path').forEach(p => p.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--lavender').trim()));
}

$core_js

$source_js

$cards_js

$detail_js

$graph_js

$layers_js

// -- Init --
renderSource();
</script>
